<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">All Welcome</title>
  <desc id="description">An open circle welcomes an equal participant into a shared centre.</desc>
