  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="#f7f9ff" stroke="#c2cbe0" stroke-width="3"/>
  <g fill="none" stroke="url(#brand-gradient)" stroke-linecap="round">
    <path data-opening="true" d="M17 47a21.2 21.2 0 1 1 30 0" stroke-width="4"/>
    <path data-spoke="true" d="M32 10.5V32" stroke-width="2.25" opacity=".62"/>
    <path data-spoke="true" d="M50.6 21.25 32 32" stroke-width="2.25" opacity=".62"/>
    <path data-spoke="true" d="M50.6 42.75 32 32" stroke-width="2.25" opacity=".62"/>
    <path data-spoke="true" d="M32 56.5V32" stroke-width="2.25" opacity=".62"/>
