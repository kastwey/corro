# CI: the three test layers on every push/PR.
#  * frontend — TypeScript build + node:test suites (incl. translation parity)
#  * server   — .NET build + xUnit suites (unit + integration playthroughs)
#  * e2e      — Playwright against the real server in its deterministic E2E mode
#               (scripted dice, in-memory persistence; no external services needed)
# Every layer first checks the hidden packages out of their private repository, when the
# HIDDEN_PACKAGES_TOKEN secret is there (.github/actions/hidden-packages): a fork runs without
# them, exactly as it would run the engine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The private package repository asks for this on every push to its main: a package change is a
  # production change, and it goes through the same three layers before it is deployed.
  repository_dispatch:
    types: [hidden-packages-updated]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/hidden-packages # the guide test walks every package on disk
        with:
          token: ${{ secrets.HIDDEN_PACKAGES_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/hidden-packages # KeyIntegrityTests covers every package on disk
        with:
          token: ${{ secrets.HIDDEN_PACKAGES_TOKEN }}
      - name: Test development tooling
        shell: pwsh
        run: |
          ./tools/tests/emulator-startup.tests.ps1
          ./tools/tests/hook-installation.tests.ps1
          ./tools/tests/hidden-packages-link.tests.ps1
          ./tools/tests/repository-language.tests.ps1
          ./tools/tests/build-version.tests.ps1
          ./tools/tests/deployment-gate.tests.ps1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5 # the server build compiles the frontend into wwwroot
        with:
          node-version: 22
      - run: dotnet build server/CorroServer.csproj --nologo
      - run: dotnet test server.tests/CorroServer.Tests.csproj --nologo

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/hidden-packages # the server under test stages every package it finds
        with:
          token: ${{ secrets.HIDDEN_PACKAGES_TOKEN }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # The Playwright webServer starts the game server itself (dotnet run, E2E env).
      # `npm test` picks its own shard count from the runner's cores and starts one server per
      # shard; a small runner resolves to a single shard and behaves exactly as it always did.
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          # Glob, because a sharded run writes playwright-report-1, -2, … instead. Naming the
          # unsuffixed folder alone would silently upload nothing on a bigger runner.
          path: e2e/playwright-report*/
          retention-days: 7

  deploy-production:
    name: Deploy production
    # A push to main, or the private package repository asking for a redeploy of the current main.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'repository_dispatch'
    needs: [frontend, server, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://imperio.kastwey.org
    concurrency:
      group: deploy-imperio-production
      # Never interrupt an App Service deployment halfway through. Once this job gets
      # the lock, the freshness check below skips it if a newer main commit exists.
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      PRODUCTION_URL: https://imperio.kastwey.org
    steps:
      - name: Check that this is still the latest main commit
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping obsolete deployment for $GITHUB_SHA; main is now $latest_sha."
          fi

      - name: Validate Azure deployment configuration
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          missing=0
          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP \
            AZURE_WEBAPP_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured in the production GitHub environment."
              missing=1
            fi
          done
          if [[ -z "$HIDDEN_PACKAGES_TOKEN" ]]; then
            echo "::error::HIDDEN_PACKAGES_TOKEN is not configured; production would ship without the hidden packages."
            missing=1
          fi
          exit "$missing"
        env:
          HIDDEN_PACKAGES_TOKEN: ${{ secrets.HIDDEN_PACKAGES_TOKEN }}

      - name: Check out the tested commit
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/checkout@v5
        with:
          # Full history: the build stamp is the commit's UTC day plus that day's ordinal, counted
          # over the commits it is built on. A shallow clone knows only the tip, so every release
          # would claim to be the first update of its day (build-version.ps1 refuses outright).
          fetch-depth: 0

      - name: Log in to Azure with OIDC
        if: steps.freshness.outputs.deploy == 'true'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The daily retention worker runs inside the existing S1 App Service so it can coordinate
      # with live SignalR sessions. Keep the worker resident; this changes no app settings or secrets.
      - name: Ensure scheduled retention stays active
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          always_on="$(az webapp config show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query alwaysOn \
            --output tsv \
            --only-show-errors)"
          if [[ "$always_on" != "true" ]]; then
            always_on="$(az webapp config set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --always-on true \
              --query alwaysOn \
              --output tsv \
              --only-show-errors)"
          fi
          if [[ "$always_on" != "true" ]]; then
            echo "::error::App Service Always On was not enabled."
            exit 1
          fi

      # The hidden, non-distributable packages live in their private repository. Production always
      # ships its main; the resulting application is never uploaded as a GitHub artifact.
      - name: Restore hidden packages
        if: steps.freshness.outputs.deploy == 'true'
        uses: ./.github/actions/hidden-packages
        with:
          token: ${{ secrets.HIDDEN_PACKAGES_TOKEN }}
          ref: main

      - name: Set up Node.js
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up .NET
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install frontend dependencies
        if: steps.freshness.outputs.deploy == 'true'
        working-directory: frontend
        run: npm ci

      # The three test jobs saw the hidden packages too, but each on the branch it was given and
      # without the validator an upload goes through. This is the set that is about to ship, on
      # the disk it ships from: validate here, and refuse to publish rather than ship a broken board.
      - name: Validate every package before publishing
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          set -euo pipefail

          # Committed packages are the floor: anything at or below it means the restore produced
          # no hidden board, which is a silent downgrade of production, not a deployment.
          tracked="$(git ls-files server/Packages | awk -F/ 'NF>3 {print $3}' | sort -u | wc -l)"
          present="$(find server/Packages -mindepth 1 -maxdepth 1 -type d | wc -l)"
          echo "Packages on disk: $present ($tracked committed, $((present - tracked)) restored)."
          if [ "$present" -le "$tracked" ]; then
            echo "::error::the private repository restored no packages — refusing to publish"
            exit 1
          fi

          # The same validator an upload goes through, built once and reused.
          dotnet build tools/Corro.PackageCli -p:SkipFrontendBuild=true --nologo
          cli=tools/Corro.PackageCli/bin/Debug/net10.0/corro-package.dll
          failed=0
          for dir in server/Packages/*/; do
            [ -f "$dir/manifest.json" ] || continue
            if ! dotnet "$cli" validate "$dir"; then
              echo "::error::package validation failed for ${dir%/}"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

          # Dangling i18n keys are what an engine change breaks in a board nobody re-validated.
          dotnet test server.tests/CorroServer.Tests.csproj --nologo \
            --filter "FullyQualifiedName~KeyIntegrityTests"

      - name: Publish application
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/publish"
          dotnet publish server/CorroServer.csproj \
            --configuration Release \
            --output "$publish_dir" \
            --nologo

          test -f "$publish_dir/CorroServer.dll"
          test -f "$publish_dir/wwwroot/index.html"
          test -f "$publish_dir/wwwroot/board.html"
          # Both localized page shells and both controller-filled notice templates must ship.
          test -f "$publish_dir/wwwroot/privacy/index.html"
          test -f "$publish_dir/wwwroot/es/privacy/index.html"
          test -f "$publish_dir/Legal/privacy.en.md"
          test -f "$publish_dir/Legal/privacy.es.md"

          source_packages="$(find server/Packages -mindepth 2 -maxdepth 2 -name manifest.json -type f | wc -l)"
          published_packages="$(find "$publish_dir/Packages" -mindepth 2 -maxdepth 2 -name manifest.json -type f | wc -l)"
          if [[ "$source_packages" -ne "$published_packages" ]]; then
            echo "::error::Package count mismatch: source=$source_packages, published=$published_packages."
            exit 1
          fi

          # Which build this is, for the lobby footer: the commit's UTC day and that day's
          # ordinal. Written INTO the published application, so the stamp travels with the
          # release and a server run from source simply has none.
          pwsh -File tools/build-version.ps1 \
            -Sha "$GITHUB_SHA" \
            -RepositoryUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -OutputPath "$publish_dir/buildinfo.json"
          test -f "$publish_dir/buildinfo.json"
          # Kept for the post-deployment check: a stamp that never reaches production would
          # otherwise fail silently, as a footer that simply shows no version.
          echo "BUILD_VERSION=$(jq -r '.Build.Version' "$publish_dir/buildinfo.json")" >> "$GITHUB_ENV"

          # The marker makes the post-deployment check prove that this exact commit is live,
          # rather than merely accepting a healthy response from the previous release.
          printf '%s\n' "$GITHUB_SHA" > "$publish_dir/wwwroot/deployment.txt"
          (
            cd "$publish_dir"
            zip -q -r "$RUNNER_TEMP/corro.zip" .
          )

      - name: Deploy to Azure App Service
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path "$RUNNER_TEMP/corro.zip" \
            --type zip \
            --clean true \
            --restart true \
            --track-status true \
            --only-show-errors

      - name: Verify production
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          deployed_sha="$(curl --fail --silent --show-error --location \
            --retry 24 --retry-delay 5 --retry-all-errors \
            "$PRODUCTION_URL/deployment.txt")"
          if [[ "$deployed_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Production returned commit '$deployed_sha'; expected '$GITHUB_SHA'."
            exit 1
          fi
          curl --fail --silent --show-error --retry 24 --retry-delay 5 --retry-all-errors \
            "$PRODUCTION_URL/api/packages/shipped" > /dev/null

          # The build stamp the lobby footer will show. A stamp that did not ship, or one the
          # server refused as malformed, hides the footer entry instead of failing anything, so
          # the only way to notice is to ask production what it thinks it is running.
          reported="$(curl --fail --silent --show-error --retry 24 --retry-delay 5 --retry-all-errors \
            "$PRODUCTION_URL/api/config/version")"
          if ! jq -e --arg version "$BUILD_VERSION" --arg sha "$GITHUB_SHA" \
            '.configured == true and .version == $version and .commit == $sha' \
            <<< "$reported" > /dev/null; then
            echo "::error::Production reports version '$reported'; expected '$BUILD_VERSION' at '$GITHUB_SHA'."
            exit 1
          fi

          {
            echo '### Production deployment'
            echo ''
            echo "- URL: $PRODUCTION_URL/"
            echo "- Version: \`$BUILD_VERSION\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo '- Exact revision and API checks: passed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of Azure
        if: always() && steps.freshness.outputs.deploy == 'true'
        # Login failures leave no account to log out. Cleanup must not hide the real error.
        run: az logout || true
